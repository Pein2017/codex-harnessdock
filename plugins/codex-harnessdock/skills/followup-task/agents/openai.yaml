interface:
  display_name: "CC Follow-up Task"
  short_description: "Experimental: send work and guarantee Agent activation"
  default_prompt: "Experimental: use $codex-harnessdock:followup-task and invoke mcp__codex_harnessdock__followup_task to continue a named Agent. Its whole route, behavioral authority, and reasoning effort are frozen at creation and inherited unchanged; this tool accepts no write, harness, topology, or reasoning_effort, and a different route means a new Agent. A route proving fresh_only continuation refuses a second turn. Summarize success without raw JSON, never fall back to shell, and remember that completion cannot reactivate an idle Codex parent."
