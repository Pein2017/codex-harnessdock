interface:
  display_name: "HarnessDock Wait Agent"
  short_description: "Experimental: join one Agent turn or a fixed completion barrier"
  default_prompt: "Experimental: use $codex-harnessdock:wait-agent and invoke mcp__codex_harnessdock__wait_agent for a current-root Agent observation; when targets are known, pass one to eight exact targets for one fixed turn or all-settled barrier. With wake_on_progress, pass exactly one target; two or more targets remain a completion-only barrier. Never fall back to a shell command. Use the fixed one-hour completion bound. Set wake_on_progress only for one intentional intermediate observation per Agent turn; never repeat it by reflex. After a quiet timeout, call wait_agent again directly without narration or a list_agents/read_agent_messages probe. Use completion_message when completion evidence is needed because waiting cannot reactivate an idle Codex parent."
