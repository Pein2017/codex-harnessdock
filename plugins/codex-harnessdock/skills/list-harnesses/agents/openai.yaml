interface:
  display_name: "HarnessDock List Harnesses"
  short_description: "Experimental: inspect admitted Harnesses, readiness, and exact route constraints"
  default_prompt: "Experimental: use $codex-harnessdock:list-harnesses and invoke mcp__codex_harnessdock__list_harnesses with no arguments to report which Harnesses this checkout admits, each logical instance's readiness and liveValidated flag, capability maturity, exact admitted models and topologies, capacity, and unsupported capabilities. For Pi and OpenCode the models and each model's or variant's admitted reasoning efforts come from fresh native discovery on every call, never a fixed list; it enumerates no native configuration, plugins, MCP servers, or tools. Report what exists; never order, score, or select a route, and never treat an unavailable Harness as removed. Never fall back to a shell command, and remember that inspection cannot reactivate an idle Codex parent."
