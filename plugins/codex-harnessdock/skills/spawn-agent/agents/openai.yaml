interface:
  display_name: "HarnessDock Spawn Agent"
  short_description: "Experimental: start an asynchronous durable Agent on one stated route"
  default_prompt: "Experimental: use $codex-harnessdock:spawn-agent and invoke mcp__codex_harnessdock__spawn_agent with a self-contained message and the whole route stated: harness, full model, topology, write authority, and reasoning_effort. Call $codex-harnessdock:list-harnesses immediately before selection: it is the current admitted inventory. Nothing is defaulted, inferred, aliased, or substituted; every route field, including effort, is freshly validated against native discovery. Use native_orchestrator only when fresh listing admits it as an experimental Native Agent Team lead, whose transport requires an asynchronously launched named member plus a successful correlated SendMessage to that current-team name; definition models are requested only and teammate effective model, effort, and cost stay unknown without native facts. Pi and OpenCode write authority is behavioral prompt/receipt-only and inherits native configuration unchanged for either value; do not claim native tool filtering, sandboxing, permission switching, or containment. Never fall back to a shell command, and remember that completion cannot reactivate an idle Codex parent."
