interface:
  display_name: "CC Spawn Agent"
  short_description: "Experimental: start an asynchronous durable Agent on one stated route"
  default_prompt: "Experimental: use $codex-harnessdock:spawn-agent and invoke mcp__codex_harnessdock__spawn_agent with a self-contained message and the whole route stated: harness, full model, topology, write authority, and reasoning_effort. Nothing is defaulted or inferred; every route field, including effort, is freshly validated against native discovery, and $codex-harnessdock:list-harnesses reports what is admitted. Use topology native_orchestrator only with exact Opus or Fable as an experimental Native Agent Team lead, whose transport requires an asynchronously launched named member plus a successful correlated SendMessage to that current-team name; definition models are requested only and teammate effective model, effort, and cost stay unknown without native facts. The opencode route is Experimental, attach-only, leaf-only, and requires an explicit reasoning_effort mapped to one Server-advertised variant; it inherits native configuration unchanged for either write authority and supports neither interruption nor history. Never fall back to a shell command, and remember that completion cannot reactivate an idle Codex parent."
